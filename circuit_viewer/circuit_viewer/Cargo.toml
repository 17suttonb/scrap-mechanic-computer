[package]
name = "circuit-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only Circuit Workshop viewer for Scrap Mechanic"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

